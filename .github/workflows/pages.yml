name: Publish Russian learning hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate website
        working-directory: sites-plugin-sites-openai-curated-remote/work/life-spark
        run: |
          node --check dist/app.js
          node --check dist/sw.js
          node build-resource-directory.cjs --check
          node check-russian-hub.cjs
          node audit-site.cjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: sites-plugin-sites-openai-curated-remote/work/life-spark/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
