<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173653">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>登录 · 俄语星球</title>
<script>try{document.documentElement.dataset.mode=localStorage.getItem('sparkMode')||'dark'}catch(e){document.documentElement.dataset.mode='dark'}</script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=36">
<script defer src="auth-config.js?v=2"></script>
<script defer src="auth-client.js?v=1"></script>
<script defer src="auth-pages.js?v=1"></script>
</head>
<body class="auth-page" data-auth-page="login">
<main class="auth-shell">
  <a class="back-link" href="./">← 返回首页</a>
  <section class="auth-card" aria-labelledby="auth-title">
    <p class="auth-kicker">可选账号</p>
    <h1 id="auth-title">在不同设备上，<br>接着学。</h1>
    <p class="auth-intro">不登录也能完整使用网站。登录后可由你主动同步收藏、学习计划和练习成绩。</p>
    <form id="authForm" class="auth-form">
      <label for="authEmail">邮箱地址</label>
      <div class="auth-input-row"><input id="authEmail" name="email" type="email" autocomplete="email" placeholder="name@example.com" required><button id="authSubmit" class="primary" type="submit">发送登录链接</button></div>
      <small>无需密码。我们会向邮箱发送一次性登录链接。</small>
    </form>
    <div id="signedIn" class="auth-signed" hidden><span>当前已登录</span><strong id="signedInEmail"></strong><a class="primary" href="account.html">进入我的账户 →</a></div>
    <p id="authStatus" class="auth-status" role="status" aria-live="polite"></p>
    <div class="auth-privacy"><b>你的选择</b><p>游客数据留在当前浏览器；登录本身不会自动上传学习数据，只有点击“同步到云端”后才会上传。</p></div>
  </section>
</main>
</body>
</html>
