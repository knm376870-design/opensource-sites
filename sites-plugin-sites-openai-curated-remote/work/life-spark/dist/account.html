<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173653"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="strict-origin-when-cross-origin">
<title>我的账户 · 俄语星球</title>
<script>try{document.documentElement.dataset.mode=localStorage.getItem('sparkMode')||'light'}catch(e){document.documentElement.dataset.mode='light'}</script>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css?v=40">
<script defer src="auth-config.js?v=2"></script><script defer src="auth-client.js?v=2"></script><script defer src="auth-pages.js?v=3"></script>
</head>
<body class="auth-page" data-auth-page="account">
<main class="auth-shell auth-shell-wide"><a class="back-link" href="./">← 返回首页</a>
  <header class="auth-header"><p class="auth-kicker">个人空间</p><h1>我的账户</h1><p>账号是可选项。本地学习功能始终可以单独使用。</p></header>
  <section id="accountSignedOut" class="auth-card auth-empty" hidden><h2>当前是游客模式</h2><p>收藏与进度保存在这个浏览器里。登录后可以选择同步。</p><a class="primary" href="auth.html">前往登录</a></section>
  <section id="accountPanel" class="account-grid" hidden>
    <article class="auth-card account-profile"><span>登录邮箱</span><h2 id="accountEmail">—</h2><p>创建时间：<b id="accountCreated">—</b></p><a id="adminLink" href="admin.html" hidden>进入管理后台 →</a></article>
    <article class="auth-card"><span>本机数据</span><div class="account-metrics"><div><strong id="localFavorites">0</strong><small>收藏</small></div><div><strong id="localRoadmap">0</strong><small>路线记录</small></div><div><strong id="localPractice">0</strong><small>练习记录</small></div></div></article>
    <article class="auth-card account-sync"><span>云端备份</span><h2 id="cloudUpdated">尚未同步</h2><p>同步与恢复都需要你确认，不会在后台自动进行。</p><div class="auth-actions"><button id="syncNow" class="primary" type="button">同步到云端</button><button id="restoreNow" type="button">从云端恢复</button></div></article>
    <article class="auth-card account-danger"><span>账号操作</span><p>退出后，本机已有数据不会被删除。</p><button id="signOut" type="button">退出登录</button></article>
  </section>
  <p id="authStatus" class="auth-status" role="status" aria-live="polite"></p>
</main></body></html>
