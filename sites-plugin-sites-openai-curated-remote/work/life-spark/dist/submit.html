      <svg class="ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3L17 7M7 17l-1.7 1.7" stroke-width="1.8" stroke-linecap="round"/></svg>
      <svg class="ic-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 13.6A8.4 8.4 0 0 1 10.4 3.8a8.4 8.4 0 1 0 9.8 9.8Z"/></svg>
    </button>

<main class="wrap">

<section class="page-head">
  <a class="back-link" href="index.html">← 回到首页</a>
  <h1 class="page-title">提交收录</h1>
</section>

<section class="panel">
  <div class="panel-head">
    <span class="win-dots" aria-hidden="true"><i></i><i></i><i></i></span>
    <div><span class="section-kicker">把你的好站加进来</span><h2>提交收录</h2><p class="muted">填好下面的信息，生成申请模板，发送到合作邮箱即可；内容健康、访问正常的站点都会优先收录。</p></div>
  </div>
  <div class="formrow">
    <label><span>网站名称</span><input class="text-input" id="f-name" type="text" placeholder="例如：生活灵感实验室"></label>
    <label><span>网址</span><input class="text-input" id="f-url" type="text" placeholder="https://…"></label>
    <label><span>一句话简介（选填）</span><input class="text-input" id="f-desc" type="text" placeholder="这个站是做什么的？"></label>
    <button class="primary" id="makeTpl" type="button">生成申请模板 ↗</button>
  </div>
  <!-- 变现绑定点：将 __OWNER_EMAIL__ 替换为真实邮箱后，更新下方占位文案 -->
  <p class="form-note">点击后自动复制申请模板，粘贴发送到合作邮箱即可；邮箱地址即将公布。</p>
  <p class="form-note" id="tplNote" hidden></p>
</section>

<footer>
  <div class="footer-title">日常，值得玩一下。</div>
  <div class="footer-links"><a href="about.html">关于我们</a><a href="friends.html">友情链接</a><a href="submit.html">提交收录</a><a href="ad.html">广告合作</a></div>

</footer>

</main>
</div>
<script>
document.getElementById('modeToggle').onclick=function(){var d=document.documentElement.dataset.mode,m=d==='dark'?'light':'dark';document.documentElement.dataset.mode=m;try{localStorage.setItem('sparkMode',m)}catch(e){}};
document.getElementById('makeTpl').onclick=function(){
  var name=document.getElementById('f-name').value.trim(),url=document.getElementById('f-url').value.trim(),desc=document.getElementById('f-desc').value.trim(),note=document.getElementById('tplNote');
  if(!name||!url){note.hidden=false;note.textContent='请先填写网站名称和网址。';return;}
  var tpl='【提交收录】\n网站名称：'+name+'\n网址：'+url+'\n一句话简介：'+(desc||'（未填写）')+'\n—— 来自生活灵感实验室收录申请';
  function ok(){note.hidden=false;note.textContent='申请模板已复制，粘贴发送到合作邮箱即可。'}
  function fail(){note.hidden=false;note.textContent='复制失败，请手动复制：\n'+tpl;}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(tpl).then(ok,fail);}else{fail();}
};
</script>
</body>
</html>
